# Optional: apply this only on a cluster that actually has schedulable GPU capacity (check
# `oc get nodes -o jsonpath='{.items[*].status.capacity.nvidia\.com/gpu}'`). Without a
# HardwareProfile carrying an nvidia.com/gpu identifier, deploy-example-workload.sh's
# auto-detection (detect_gpu_hardware_profile) falls back to whatever non-GPU profile exists
# (e.g. the RHOAI-shipped "default-profile") purely to satisfy the
# hardwareprofile-llmisvc-injector admission webhook — which does not by itself make the pod
# request real GPU capacity.
#
# "local-gpu" is the name the sibling maas-rhoai project's manifests already default to.
#
# CPU/memory defaults below are tuned down (1 CPU / 1Gi default, 16Gi memory ceiling) for a
# memory-constrained single-VM dev cluster (e.g. CRC) — the companion
# qwen3-8b-kserve-router-scheduler pod was previously seen Pending with "Insufficient memory"
# at the original 16Gi-default/32Gi-max sizing. Raise maxCount/defaultCount back up on a
# cluster with more headroom.
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: local-gpu
  namespace: redhat-ods-applications
  annotations:
    opendatahub.io/display-name: local-gpu
    opendatahub.io/description: Single NVIDIA GPU profile for local/dev clusters (e.g. CRC with GPU passthrough).
    opendatahub.io/disabled: "false"
  labels:
    app.kubernetes.io/part-of: hardwareprofile
    app.opendatahub.io/hardwareprofile: "true"
spec:
  identifiers:
    - displayName: CPU
      identifier: cpu
      resourceType: CPU
      defaultCount: 1
      minCount: 1
      maxCount: 4
    - displayName: Memory
      identifier: memory
      resourceType: Memory
      defaultCount: 1Gi
      minCount: 1Gi
      maxCount: 16Gi
    - displayName: GPU
      identifier: nvidia.com/gpu
      resourceType: Accelerator
      defaultCount: 1
      minCount: 1
      maxCount: 1
